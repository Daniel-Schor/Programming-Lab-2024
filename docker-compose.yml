services:
  node-app:
    build: .
    container_name: node-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depens_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: pizza
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d